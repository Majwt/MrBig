name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.26.7 or 0.26.8-rc1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Validate and commit version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" != branch ]]; then
          echo "::error::Select a branch when running this workflow."
          exit 1
        fi
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$ ]]; then
          echo "::error::Version must be X.Y.Z or X.Y.Z-rcN, without a v prefix or leading zeros."
          exit 1
        fi
        if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
          echo "::error::Tag v$VERSION already exists."
          exit 1
        fi
        if [[ $(grep -c '^VERSION=' Makefile) != 1 ]]; then
          echo "::error::Expected exactly one VERSION assignment in Makefile."
          exit 1
        fi
        sed -i "s/^VERSION=.*/VERSION=$VERSION/" Makefile
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Makefile
        if ! git diff --cached --quiet; then
          git commit -m "Release v$VERSION"
        fi

    - name: Install MinGW cross-compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y make mingw-w64 binutils-mingw-w64 zip

    - name: Build MrBig
      run: make all

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mrbig-binaries-${{ inputs.version }}
        path: |
          X64/mrbig64.exe
          X86/mrbig.exe
        if-no-files-found: error

    - name: Tag, push, and publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git tag -a "v$VERSION" -m "Release v$VERSION"
        git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$VERSION"
        release_args=(--latest)
        if [[ "$VERSION" == *-rc* ]]; then
          release_args=(--prerelease --latest=false)
        fi
        gh release create "v$VERSION" X86/mrbig.exe X64/mrbig64.exe \
          --verify-tag --title "v$VERSION" --generate-notes "${release_args[@]}"
